[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openea-community"
version = "1.5.2"
description = "OpenEA Community enterprise architecture platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
authors = [{name = "OpenEA Contributors"}]
dependencies = [
  "fastapi>=0.128,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.15,<2.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "jinja2>=3.1,<4.0",
  "argon2-cffi>=23.1,<26.0",
  "python-multipart>=0.0.20,<1.0",
  "itsdangerous>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<10.0",
  "ruff>=0.11,<1.0",
  "playwright>=1.50,<2.0",
  "pytest-playwright>=0.7,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

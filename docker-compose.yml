services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openea}
      POSTGRES_USER: ${POSTGRES_USER:-openea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openea}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openea} -d ${POSTGRES_DB:-openea}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli seed-system && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    environment:
      APP_NAME: ${APP_NAME:-OpenEA Community}
      PAGE_TITLE: ${PAGE_TITLE:-OpenEA Community}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      SECRET_KEY: ${SECRET_KEY:-replace-this-with-a-long-random-secret}
      SESSION_MAX_AGE_SECONDS: ${SESSION_MAX_AGE_SECONDS:-28800}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-openea}:${POSTGRES_PASSWORD:-openea}@postgres:5432/${POSTGRES_DB:-openea}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${OPENEA_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.workers.metrics_worker"]
    environment:
      APP_NAME: ${APP_NAME:-OpenEA Community}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BASE_URL: ${BASE_URL:-http://localhost:8000}
      SECRET_KEY: ${SECRET_KEY:-replace-this-with-a-long-random-secret}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-openea}:${POSTGRES_PASSWORD:-openea}@postgres:5432/${POSTGRES_DB:-openea}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:

  postgres_data:

name: OpenEA Community CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Environment and Lint Validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install OpenEA Community
        run: pip install -e '.[dev]'

      - name: Ruff
        run: ruff check .

      - name: Compile Python
        run: python -m compileall -q app scripts

      - name: Run tests
        run: pytest -q
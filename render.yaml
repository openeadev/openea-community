services:
  - type: web
    name: openea-community-demo
    runtime: docker
    plan: free
    branch: main

    autoDeployTrigger: checksPass

    buildFilter:
      ignoredPaths:
        - docs/**
        - mkdocs.yml
        - requirements-docs.txt
        - README.md

    dockerfilePath: ./Dockerfile
    dockerCommand: /bin/sh scripts/render-start.sh

    healthCheckPath: /health/ready

    envVars:
      - key: APP_NAME
        value: OpenEA Community

      - key: APP_VERSION
        value: 1.5.2

      - key: PAGE_TITLE
        value: OpenEA Community

      - key: ENVIRONMENT
        value: production

      - key: DEBUG
        value: "false"

      - key: LOG_LEVEL
        value: INFO

      - key: BASE_URL
        value: https://demo.openea.dev

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: openea-community-db
          property: connectionString

      - key: DEMO_RESET_ON_DEPLOY
        value: "true"

      - key: DEMO_FORCE_RESET
        value: "false"

      - key: DEMO_ADMIN_PASSWORD
        generateValue: true

      - key: DEMO_USER_PASSWORD
        sync: false

databases:
  - name: openea-community-db
    plan: free
    postgresMajorVersion: "16"